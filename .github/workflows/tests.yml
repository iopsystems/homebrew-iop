name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
    # The default types plus ready_for_review, so a draft pull request is
    # autotagged once it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os:
          - macos-15
        include:
          # Homebrew's sandbox on Linux needs more than a bare GitHub runner
          # provides, so (like upstream `brew tap-new` taps) build Linux
          # bottles inside Homebrew's own privileged container.
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      # Some formulae (systemslab) build from private repositories, which
      # GITHUB_TOKEN can't read. Dependabot runs don't get Actions secrets, so
      # they fall back to GITHUB_TOKEN; they only bump actions and don't build
      # the private formulae.
      #
      # In the container, directories mounted by the runner are owned by the
      # host user, so the token action can't write its outputs. setup-homebrew
      # fixes this the same way, but it needs the token so runs later.
      - name: Give the container user access to the runner's temp directory
        if: matrix.container && github.actor != 'dependabot[bot]'
        run: sudo setfacl -Rm "d:u:$(whoami):rwX,u:$(whoami):rwX" "$RUNNER_TEMP"

      - name: Create a GitHub App token
        id: app-token
        if: github.actor != 'dependabot[bot]'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IOPSYSTEMS_AUTOMATION_APPID }}
          private-key: ${{ secrets.IOPSYSTEMS_AUTOMATION_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-iop,systemslab
          permission-contents: read

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Homebrew fetches Git sources with $HOME set to the user's real home
      # directory, but in the container setup-homebrew writes the token to the
      # runner's $HOME (/github/home) instead. Copy it across so private
      # repositories can still be cloned.
      - name: Expose the access token to Homebrew's Git
        if: matrix.container
        run: |
          set +x
          key="http.${GITHUB_SERVER_URL}/.extraheader"
          home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          git config --file "$home/.gitconfig" "$key" "$(git config --global --get "$key")"

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  autotag:
    # Dependabot PRs only bump actions and have no bottles to publish, so they
    # are merged normally rather than through `brew pr-pull`. Draft PRs are
    # left alone, since the pr-pull label publishes the PR to main.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.base_ref == 'main' &&
      github.repository == 'iopsystems/homebrew-iop' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs:
      - test-bot
    permissions: {}
    steps:
      # Labelling with GITHUB_TOKEN would not trigger the publish workflow, so
      # use a GitHub App token instead.
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IOPSYSTEMS_AUTOMATION_APPID }}
          private-key: ${{ secrets.IOPSYSTEMS_AUTOMATION_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-iop
          permission-pull-requests: write

      - name: Add the pr-pull label to the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=pr-pull"
