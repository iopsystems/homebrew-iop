name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os:
          - macos-15
          - macos-14
        include:
          # Homebrew's sandbox on Linux needs more than a bare GitHub runner
          # provides, so (like upstream `brew tap-new` taps) build Linux
          # bottles inside Homebrew's own privileged container.
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          # Needs access to the private repositories some formulae build from.
          token: ${{ secrets.API_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  autotag:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.repository == 'iopsystems/homebrew-iop'
    runs-on: ubuntu-latest
    needs:
      - test-bot
    permissions:
      issues: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.LABEL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the pr-pull label to the issue
        run: gh issue edit "$PR" --add-label "pr-pull"
