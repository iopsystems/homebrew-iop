name: Update skills-mcp Formula

on:
  # The daily check is how releases normally land here. Offset from the
  # Rezolus check so the two updaters do not open pull requests in the same
  # minute. To bump right after a release instead of waiting for it, run this
  # workflow by hand.
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for new skills-mcp release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/iopsystems/skills-mcp/releases/latest --jq '.tag_name')
          echo "latest_tag=$LATEST" >> "$GITHUB_OUTPUT"

          # Extract version without the leading 'v'
          LATEST_VERSION="${LATEST#v}"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          # skills-mcp.rb builds from a git tag rather than a source tarball, so
          # the current version lives in the `tag:` argument and the source is
          # pinned by the tag's commit in `revision:` instead of a checksum.
          CURRENT_VERSION=$(grep -oP '^\s*tag:\s+"v\K[0-9]+\.[0-9]+\.[0-9]+' Formula/skills-mcp.rb)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_VERSION" = "$CURRENT_VERSION" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Formula is already up to date (v$CURRENT_VERSION)"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "New version available: v$CURRENT_VERSION -> v$LATEST_VERSION"
          fi

      - name: Update formula
        if: steps.check.outputs.up_to_date == 'false'
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest_tag }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
        run: |
          # Point the formula at the new tag. The stale `bottle do` block is
          # left alone on purpose: `brew test-bot` rebuilds the bottles for this
          # pull request and `brew pr-pull` rewrites the block from them.
          # `brew audit` requires the commit alongside a git tag. `^{}` resolves
          # an annotated tag to its commit; a lightweight tag has no such ref.
          REPO=https://github.com/iopsystems/skills-mcp.git
          REVISION=$(git ls-remote "$REPO" "refs/tags/${LATEST_TAG}^{}" | cut -f1)
          if [ -z "$REVISION" ]; then
            REVISION=$(git ls-remote "$REPO" "refs/tags/${LATEST_TAG}" | cut -f1)
          fi
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve ${LATEST_TAG} to a commit"; exit 1; }
          [ "$(grep -cE '^\s*revision:\s+"[0-9a-f]{40}"' Formula/skills-mcp.rb)" = 1 ]
          sed -i -E "s|(tag:\s+)\"v${CURRENT_VERSION}\"|\1\"${LATEST_TAG}\"|" Formula/skills-mcp.rb
          sed -i -E "s|(revision:\s+)\"[0-9a-f]{40}\"|\1\"${REVISION}\"|" Formula/skills-mcp.rb
          grep -nE 'tag:|revision:' Formula/skills-mcp.rb

      - name: Create pull request
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.API_TOKEN }}
          commit-message: "skills-mcp: update to ${{ steps.check.outputs.latest_version }}"
          branch: update-skills-mcp-${{ steps.check.outputs.latest_version }}
          title: "skills-mcp: update to ${{ steps.check.outputs.latest_version }}"
          body: |
            Automated update of the skills-mcp formula to [${{ steps.check.outputs.latest_tag }}](https://github.com/iopsystems/skills-mcp/releases/tag/${{ steps.check.outputs.latest_tag }}).
          delete-branch: true
